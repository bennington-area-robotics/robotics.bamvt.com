name: Page timestamps

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Install test runner
        run: gem install minitest --version '~> 5.0' --no-document
      - name: Test timestamp automation
        run: ruby bin/tests/last_modified_test.rb
      - name: Check page timestamps
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base=$(git merge-base "$PR_BASE" "$PR_HEAD")
            ruby bin/last-modified --check "$base" "$PR_HEAD"
          elif [[ "$PUSH_BASE" =~ ^0+$ ]]; then
            ruby bin/last-modified --check HEAD HEAD
          else
            ruby bin/last-modified --check "$PUSH_BASE" HEAD
          fi
