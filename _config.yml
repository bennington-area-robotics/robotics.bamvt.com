title: Bennington Area Robotics
description: Community-based youth robotics teams supporting STEM education in the greater Bennington Vermont area.
url: https://robotics.bamvt.com

# Build settings
markdown: kramdown
permalink: /blog/:slug/

# Local working files, development tools, and repository documentation are not website content.
exclude:
  - scratch/
  - resources/
  - bin/
  - vendor/
  - node_modules/
  - Gemfile
  - Gemfile.lock
  - AGENTS.md
  - README.md
  - events/season-kickoff-2026/images/README.md

plugins:
  - jekyll-redirect-from
  - jekyll-sitemap

# Keep verification and downloadable documents available, but out of search submissions.
defaults:
  - scope:
      path: "google971153aeec0ee7b8.html"
    values:
      sitemap: false
  - scope:
      path: "**/*.pdf"
    values:
      sitemap: false
