title: Bennington Area Robotics
description: Community-based youth robotics teams supporting STEM education in the greater Bennington Vermont area.
url: https://robotics.bamvt.com

# Build settings
markdown: kramdown
permalink: /blog/:slug/

# Local working files, development tools, and repository documentation are not website content.
exclude:
  - scratch/
  - resources/
  - bin/
  - vendor/
  - node_modules/
  - Gemfile
  - Gemfile.lock
  - AGENTS.md
  - README.md
  - events/season-kickoff-2026/images/README.md

plugins:
  - jekyll-redirect-from
  - jekyll-sitemap
