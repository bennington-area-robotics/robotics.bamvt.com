# _includes/event-next.html. Dates are quoted ISO strings; list events in date order.
#
# Event fields:
#   title, start, end (same as start for one-day events), type
#   type: Kickoff | Qualifier | Championship | Premier Event | World Championship
#   url: internal event page, or external_url when there is no page here
#   venue, place (city and state), directions (optional map link)
#   ftc: FTC event code; ftc_season: FTC season year used in its URL
#   host: hosting note, when we host or co-host
#   teams: team numbers that competed, when not every team attended
#   results: short highlights, shown once the event is over
#   links: extra links, each with label and url

